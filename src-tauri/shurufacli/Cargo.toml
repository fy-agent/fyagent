[package]
name = "shurufacli"
version = "0.1.0"
edition = "2024"
description = "Vibe coding 语音 Agent：输入本轮识别文本，输出可直接交给编码 Agent 的优化提示词"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.3", default-features = false, features = ["responses", "rustls"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
