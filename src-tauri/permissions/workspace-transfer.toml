[[permission]]
identifier = "allow-workspace-transfer"
description = "Allows bounded portable workspace pack preview/export/inspection/import with native file pickers and agentless SSH configuration discovery, probing, preview, and stdin push."
commands.allow = [
  "pick_workspace_pack_export_path",
  "pick_workspace_pack_file",
  "preview_workspace_pack_export",
  "export_workspace_pack",
  "inspect_workspace_pack",
  "apply_workspace_pack_import",
  "list_ssh_hosts",
  "test_ssh_target",
  "preview_ssh_config_push",
  "apply_ssh_config_push",
]
