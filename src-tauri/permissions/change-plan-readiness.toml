[[permission]]
identifier = "allow-change-plan"
description = "Allows the main local webview to create, apply, cancel and read the bounded Codex Change Plan ledger."
commands.allow = [
  "create_codex_provider_switch_plan",
  "create_codex_provider_upsert_plan",
  "create_workbuddy_save_plan",
  "apply_change_plan",
  "cancel_change_job",
  "get_change_job",
  "list_recoverable_change_jobs",
]

[[permission]]
identifier = "allow-agent-install-readiness"
description = "Allows the main local webview to read Agent install readiness/inventory and start closed Agent actions."
commands.allow = [
  "get_agent_install_readiness",
  "get_agent_installation_inventory",
  "start_agent_action",
  "cancel_agent_action",
  "get_agent_action_job",
]

[[permission]]
identifier = "allow-agent-auth"
description = "Allows the main local webview to read bounded Agent auth observations and monitor closed auth sessions."
commands.allow = [
  "get_agent_auth_observation",
  "start_agent_auth_session",
  "get_agent_auth_session",
  "get_active_agent_auth_session",
  "stop_waiting_for_agent_auth",
]

[[permission]]
identifier = "allow-managed-auth"
description = "Allows the main local webview to read and operate the bounded unified managed-auth control plane."
commands.allow = [
  "managed_auth_get_overview",
  "managed_auth_start_login",
  "managed_auth_get_login_session",
  "managed_auth_cancel_login",
  "managed_auth_reopen_login",
  "managed_auth_switch_login_method",
  "managed_auth_set_default_account",
  "managed_auth_preview_account_removal",
  "managed_auth_remove_account",
  "managed_auth_apply_connection_action",
]
