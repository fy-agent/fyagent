[[permission]]
identifier = "allow-change-plan"
description = "Allows the main local webview to create, apply, cancel and read the bounded Codex Change Plan ledger."
commands.allow = [
  "create_codex_provider_switch_plan",
  "create_codex_provider_upsert_plan",
  "create_workbuddy_save_plan",
  "apply_change_plan",
  "cancel_change_job",
  "get_change_job",
  "list_recoverable_change_jobs",
]

[[permission]]
identifier = "allow-agent-install-readiness"
description = "Allows the main local webview to read Agent install readiness and start closed Agent actions."
commands.allow = [
  "get_agent_install_readiness",
  "start_agent_action",
  "cancel_agent_action",
  "get_agent_action_job",
]
