[workspace]
members = [".", "user-helper"]
resolver = "2"

[workspace.package]
version = "0.4.2"

[package]
name = "fyagent"
version.workspace = true
description = "Personal desktop control center for AI Workers and Agents"
authors = ["NongHua123"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fyagent_lib"
# V1 targets desktop only. Keep the Rust/static library outputs used by the
# desktop host and tests; add `cdylib` only with a supported mobile build path.
crate-type = ["staticlib", "rlib"]
doctest = false

[features]
default = []
test-hooks = []
macos-privileged-client = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
once_cell = "1.21.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = "1.8"
json5 = "0.4"
json-five = "0.3.1"
sys-locale = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
fyagent-user-helper = { path = "user-helper", default-features = false }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Globalization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
] }
quick-xml = "0.38"
windows = { version = "0.61", features = [
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation",
  "Foundation_Collections",
  "Management_Deployment",
  "System",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Registry",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WindowsProgramming",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2"
windows-version = "0.1"

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
auto-launch = "0.5"
libc = "0.2"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSColor",
    "NSRunningApplication",
    "NSWorkspace",
    "block2",
] }
objc2-foundation = { version = "0.2", features = ["NSError", "NSString", "NSURL"] }
block2 = "0.5"

# Optimize release binary size for desktop packages.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
