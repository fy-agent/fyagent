["dev:renderer"]
description = "Start the Vite renderer development server"
env = { FYAGENT_TASK_EFFECT = "interactive" }
interactive = true
raw = true
run = "pnpm dev:renderer"

["build:renderer"]
description = "Build the production renderer without a desktop package"
env = { FYAGENT_TASK_EFFECT = "build-output" }
run = "pnpm build:renderer"

[typecheck]
description = "Run strict TypeScript type checking without emitting files"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm typecheck"

[lint]
description = "Lint the production renderer, domain and focused tests"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm lint"

[format]
description = "Apply the repository Prettier configuration to frontend sources"
env = { FYAGENT_TASK_EFFECT = "source-modifying" }
run = "pnpm format"

["format:files"]
description = "Format reviewed files with locked Prettier and lossless JSONL normalization"
usage = '''
arg "<files>" var=#true double_dash="optional" help="Repository files to format"
'''
env = { FYAGENT_TASK_EFFECT = "source-modifying" }
run = "node scripts/tasks/format-files.mjs"

["format:check"]
description = "Verify frontend formatting without writing files"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm format:check"

[test]
description = "Run the non-interactive frontend and desktop mock test aggregate"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = [
  { task = "test:unit" },
  { task = "test:desktop:mock" },
  { task = "test:desktop:visual:preflight" },
]

["test:unit"]
description = "Run Vitest unit and integration tests with optional controlled filters"
usage = '''
arg "[filters]" var=#true help="Vitest file or name filters"
'''
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "node scripts/tasks/frontend.mjs test-unit"

["test:unit:watch"]
description = "Run Vitest in interactive watch mode with optional controlled filters"
usage = '''
arg "[filters]" var=#true help="Vitest file or name filters"
'''
env = { FYAGENT_TASK_EFFECT = "interactive" }
interactive = true
raw = true
run = "node scripts/tasks/frontend.mjs test-watch"

["test:browser"]
description = "Run production boot and Chromium/WebKit renderer regressions"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm test:browser"

["test:performance"]
description = "Profile the production renderer serially with real animations"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm test:performance"

["test:desktop:mock"]
description = "Run desktop acceptance fake-IPC contract tests (not native evidence)"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm test:desktop:mock"

["test:desktop:visual:preflight"]
description = "Validate visual baseline manifest and candidate policy without updating images"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "pnpm test:desktop:visual:preflight"

["test:desktop:visual:update"]
description = "Validate reviewed visual evidence before a separate human Git LFS update"
usage = '''
arg "<evidence>" help="Reviewed candidate evidence JSON file"
'''
env = { FYAGENT_TASK_EFFECT = "source-modifying" }
confirm = { message = "Validate reviewed visual-baseline evidence?", default = "no" }
run = "node scripts/tasks/frontend.mjs visual-update"

["assets:icons"]
description = "Preview or regenerate every application-brand icon consumer from the reviewed Y source"
usage = '''
flag "--source <file>" help="Canonical 1024 RGBA package source path" default="assets/fyagent.png"
flag "--apply" help="Regenerate canonical PNG, Tauri and macOS tray assets; otherwise print the plan"
'''
env = { FYAGENT_TASK_EFFECT = "preview-by-default" }
run = "node scripts/tasks/frontend.mjs assets-icons"

["assets:icons:check"]
description = "Regenerate in temporary storage and verify every application-brand icon consumer"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "node scripts/tasks/frontend.mjs assets-icons-check"
