name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.run_id, github.run_attempt) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  commit-convention:
    name: Commit Convention
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout complete comparison history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify commit messages
        id: verify
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              ;;
            workflow_dispatch)
              base_sha="$CURRENT_SHA"
              head_sha="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          args=(
            --base "$base_sha"
            --head "$head_sha"
          )
          if [ "$EVENT_NAME" = pull_request ] && [ -n "${PR_TITLE:-}" ]; then
            args+=(--pr-title "$PR_TITLE")
          fi
          node scripts/ci/verify-commit-messages.mjs "${args[@]}"

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-node,verify
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  changes:
    name: Classify Changes
    needs: commit-convention
    runs-on: macos-15
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      contracts: ${{ steps.plan.outputs.contracts }}
      frontend: ${{ steps.plan.outputs.frontend }}
      desktop: ${{ steps.plan.outputs.desktop }}
      backend: ${{ steps.plan.outputs.backend }}
      windows_native: ${{ steps.plan.outputs.windows_native }}
      docs_spec: ${{ steps.plan.outputs.docs_spec }}
    steps:
      - name: Checkout complete comparison history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Classify explicit base and head commits
        id: plan
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          event_force_full=false
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              ;;
            workflow_dispatch)
              base_sha="$CURRENT_SHA"
              head_sha="$CURRENT_SHA"
              event_force_full=true
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          classifier_status=0
          node scripts/ci/classify-changes.mjs \
            --base "$base_sha" --head "$head_sha" --json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            > classifier-report.json || classifier_status=$?
          [ -s classifier-report.json ] || {
            echo 'Change classifier did not emit a JSON report' >&2
            exit 1
          }
          jq . classifier-report.json
          [ "$classifier_status" -eq 0 ] || exit "$classifier_status"

          jq --argjson eventForceFull "$event_force_full" '
            if $eventForceFull then
              .forceFull = true | .domains |= with_entries(.value = true)
            else
              .
            end
          ' classifier-report.json > ci-plan.json
          plan="$(jq -c . ci-plan.json)"
          {
            printf '\n### Final CI plan\n\n'
            printf '%s\n' "- Event: \`$EVENT_NAME\`"
            printf '%s\n' "- Event-forced Full CI: \`$event_force_full\`"
            printf '%s\n' "- Final forceFull: \`$(jq -r '.forceFull' ci-plan.json)\`"
            printf '%s\n' "- contracts: \`$(jq -r '.domains.contracts' ci-plan.json)\`"
            printf '%s\n' "- frontend: \`$(jq -r '.domains.frontend' ci-plan.json)\`"
            printf '%s\n' "- desktop: \`$(jq -r '.domains.desktop' ci-plan.json)\`"
            printf '%s\n' "- backend: \`$(jq -r '.domains.backend' ci-plan.json)\`"
            printf '%s\n' "- windowsNative: \`$(jq -r '.domains.windowsNative' ci-plan.json)\`"
            printf '%s\n' "- docsSpec: \`$(jq -r '.domains.docsSpec' ci-plan.json)\`"
            if [ "$event_force_full" = true ]; then
              printf '%s\n' '- Event policy reason: `workflow_dispatch` is the explicit Full CI diagnostic path.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf 'plan=%s\n' "$plan"
            printf 'contracts=%s\n' "$(jq -r '.domains.contracts' ci-plan.json)"
            printf 'frontend=%s\n' "$(jq -r '.domains.frontend' ci-plan.json)"
            printf 'desktop=%s\n' "$(jq -r '.domains.desktop' ci-plan.json)"
            printf 'backend=%s\n' "$(jq -r '.domains.backend' ci-plan.json)"
            printf 'windows_native=%s\n' "$(jq -r '.domains.windowsNative' ci-plan.json)"
            printf 'docs_spec=%s\n' "$(jq -r '.domains.docsSpec' ci-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify supported platform surface
        id: supported-platform
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/tasks/supported-platform-check.mjs

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-node,plan,supported-platform
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  contracts:
    name: Repository Contracts
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.docs_spec == 'true'))) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        id: setup-pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        id: setup-uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: ${{ steps.toolchain-facts.outputs.python-version }}
          enable-cache: false

      - name: Setup Rust
        id: setup-rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Synchronize locked Python environment
        id: sync-python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: uv sync --locked

      - name: Install frontend dependencies
        id: install-frontend
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust,uv,python

      - name: Run repository and release contracts
        id: contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/tasks/release-check.mjs --ci

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-pnpm,setup-node,toolchain-facts,setup-uv,setup-rust,sync-python,install-frontend,toolchains,contracts
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true')) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        id: setup-pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        id: setup-uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: ${{ steps.toolchain-facts.outputs.python-version }}
          enable-cache: false

      - name: Synchronize locked Python environment
        id: sync-python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: uv sync --locked

      - name: Install frontend dependencies
        id: install-frontend
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,uv,python

      - name: Verify application version contract
        id: version
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm run version:check

      - name: TypeScript type check
        id: typecheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm typecheck

      - name: Check formatting
        id: formatting
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm format:check

      - name: Unit tests
        id: tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # These four host-integration suites exercise the real local mise API.
        # Their pure Node contracts still run above; the real mise boundary is
        # owned by the canonical local check rather than GitHub Actions.
        run: |
          pnpm test:unit \
            --exclude tests/developmentEnvironment.test.ts \
            --exclude tests/miseTaskContract.test.ts \
            --exclude tests/systemCheck.test.ts \
            --exclude tests/taskDocs.test.ts

      - name: Locale key parity
        id: locale
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm test:i18n

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-pnpm,setup-node,toolchain-facts,setup-uv,sync-python,install-frontend,toolchains,version,typecheck,formatting,tests,locale
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  desktop-acceptance-contract:
    name: Desktop Acceptance Contract
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true')) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        id: setup-pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        id: install-frontend
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm

      - name: Run mock-only desktop acceptance tests
        id: mock-tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --throw-deprecation ./node_modules/vitest/vitest.mjs run tests/desktop-acceptance

      - name: Verify mock-only desktop acceptance contract
        id: mock-contract
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node --throw-deprecation scripts/desktop-acceptance/verify-mock-contract.mjs

      - name: Verify native Fetch through MSW and Tauri mock
        id: native-fetch
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm test:native-fetch

      - name: Verify visual baseline capture policy
        id: visual-policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: pnpm test:desktop:visual:preflight

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-pnpm,setup-node,install-frontend,toolchains,mock-tests,mock-contract,native-fetch,visual-policy
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  backend-windows:
    name: Backend Checks (Windows)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.windows_native == 'true'))) }}
    runs-on: windows-2025
    env:
      FYAGENT_WINDOWS_MANIFEST: test
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        id: setup-pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        id: setup-rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        id: cache-cargo-registry
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify active toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust

      - name: Create frontend dist placeholder
        id: frontend-placeholder
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: mkdir -p dist

      - name: Prepare Windows user helper sidecar
        id: prepare-helper
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          TAURI_ENV_DEBUG: "true"
        run: node scripts/prepare-windows-user-helper.mjs

      - name: Check Rust workspace
        id: rust-check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo check --workspace --all-targets --keep-going --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --keep-going --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        id: rust-tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --features fyagent/test-hooks --locked --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Exercise Credential Manager SecretRef CRUD
        id: secretref-hil
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          FYAGENT_NATIVE_SECRET_TEST: "1"
        shell: pwsh
        run: |
          $output = @(& cargo test --locked --manifest-path src-tauri/Cargo.toml --test secret_service_contract native_os_backend_crud_readback -- --ignored --exact --nocapture --test-threads=1 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $joined = $output -join "`n"
          if ($exitCode -ne 0 -or $joined -notmatch "test result: ok\. 1 passed; 0 failed") {
            throw "Credential Manager SecretRef CRUD did not execute exactly once"
          }

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-pnpm,setup-node,setup-rust,cache-cargo-registry,toolchains,frontend-placeholder,prepare-helper,rust-check,clippy,rust-tests,secretref-hil
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  windows-native-contracts:
    name: Windows Native Contracts (${{ matrix.architecture }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && needs.changes.outputs.windows_native == 'true')) }}
    timeout-minutes: 45
    env:
      UV_MANAGED_PYTHON: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: X64
            rust_host: x86_64-pc-windows-msvc
            python_architecture: x86_64
            python_platform: win-amd64
          - runner: windows-11-arm
            architecture: ARM64
            rust_host: aarch64-pc-windows-msvc
            python_architecture: aarch64
            python_platform: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        id: setup-rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        id: cache-cargo-registry
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        id: setup-uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: cpython-${{ steps.toolchain-facts.outputs.python-version }}-windows-${{ matrix.python_architecture }}-none
          enable-cache: false

      - name: Synchronize locked Python environment
        id: sync-python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: uv sync --locked --managed-python

      - name: Verify managed Windows toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,uv,python,rust

      - name: Create frontend dist placeholder
        id: frontend-placeholder
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Verify native Rust architecture
        id: rust-architecture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -cne '${{ matrix.architecture }}') {
            throw "Runner architecture mismatch: expected ${{ matrix.architecture }}, got $env:RUNNER_ARCH"
          }
          $rustcFacts = @(& rustc -vV 2>&1)
          $rustcExitCode = $LASTEXITCODE
          $rustHostLines = @($rustcFacts | Where-Object { $_ -match '^host:\s+\S+\s*$' })
          if ($rustcExitCode -ne 0 -or $rustHostLines.Count -ne 1) {
            throw "rustc -vV did not report exactly one host triple"
          }
          $rustHost = ($rustHostLines[0] -replace '^host:\s+', '').Trim()
          if ($rustHost -cne '${{ matrix.rust_host }}') {
            throw "Rust host mismatch: expected ${{ matrix.rust_host }}, got $rustHost"
          }

      - name: Prepare Windows user helper sidecar
        id: prepare-helper
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_host }}
          TAURI_ENV_DEBUG: "true"
        run: node scripts/prepare-windows-user-helper.mjs

      - name: Exercise explicit-SID Main package inventory
        id: explicit-sid
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $testName = "codex_desktop::platform::windows::deployment::tests::native_explicit_sid_main_query_smoke"
          $output = @(& cargo test --target '${{ matrix.rust_host }}' --lib --locked --manifest-path src-tauri/Cargo.toml $testName -- --exact 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $joined = $output -join "`n"
          if ($exitCode -ne 0 -or $joined -notmatch "test result: ok\. 1 passed; 0 failed") {
            throw "The explicit-SID Main package inventory smoke did not execute exactly once"
          }

      - name: Verify managed Python architecture
        id: python-architecture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $pythonPlatform = uv run --locked --no-sync python -c "import sysconfig; print(sysconfig.get_platform())"
          if ($LASTEXITCODE -ne 0 -or $pythonPlatform -ne '${{ matrix.python_platform }}') {
            throw "Managed Python platform mismatch: expected ${{ matrix.python_platform }}, got $pythonPlatform"
          }

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-node,setup-rust,cache-cargo-registry,toolchain-facts,setup-uv,sync-python,toolchains,frontend-placeholder,rust-architecture,prepare-helper,explicit-sid,python-architecture
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  backend-macos:
    name: Backend Checks (macOS)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.result == 'success' && needs.changes.outputs.backend == 'true')) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        id: setup-pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        id: setup-rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo registry
        id: cache-cargo-registry
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify active toolchains
        id: toolchains
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust

      - name: Create frontend dist placeholder
        id: frontend-placeholder
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: mkdir -p dist

      - name: Check Rust formatting
        id: rust-format
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

      - name: Check Rust workspace
        id: rust-check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo check --workspace --all-targets --keep-going --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --keep-going --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        id: rust-tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --features fyagent/test-hooks --locked --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: setup-pnpm,setup-node,setup-rust,cache-cargo-registry,toolchains,frontend-placeholder,rust-format,rust-check,clippy,rust-tests
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs

  required:
    name: CI / Required
    if: always()
    needs:
      - commit-convention
      - changes
      - contracts
      - frontend
      - desktop-acceptance-contract
      - backend-windows
      - windows-native-contracts
      - backend-macos
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read current run-attempt job conclusions
        id: read-job-results
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            -f per_page=100 > current-run-jobs.json
          jq -e '.total_count == (.jobs | length)' current-run-jobs.json >/dev/null || {
            echo 'Current run-attempt job response was incomplete' >&2
            exit 1
          }

      - name: Evaluate required dependency results
        id: required-gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CI_CLASSIFICATION_PLAN: ${{ needs.changes.outputs.plan }}
        run: >-
          node scripts/ci/required-gate.mjs
          --jobs-json "$(jq -c . current-run-jobs.json)"

      - name: Evaluate collected diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_REQUIRED_STEPS: read-job-results,required-gate
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/ci/evaluate-step-outcomes.mjs
