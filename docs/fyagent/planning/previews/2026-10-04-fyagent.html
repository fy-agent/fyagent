<body>

<div class="simulation"><b>模拟草图</b><span>所有路径、内容、账号与结果均为虚构。不会访问本机文件、密钥或网络，也未连接插件。</span></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const original={codex:'---\nname: review-code\n---\n# 代码审阅\n\n- 列出全部问题。\n- 用中文输出。',claude:'---\nname: review-code\n---\n# 代码审阅\n\n- 按文件排序，不限条数。'};
const paths={source:'R:\\演示\\主库\\review-code\\SKILL.md',codex:'R:\\演示\\Codex\\skills\\review-code\\SKILL.md',claude:'R:\\演示\\Claude\\skills\\review-code\\SKILL.md'};
let state={view:'desktop',tab:'skills',stage:'choose',selected:{codex:true,claude:true},choice:'',scenario:'normal',preview:0,confirmed:false,external:false,staleTriggered:false,results:{},mode:'direct',currentMode:'direct',provider:'团队 A',models:{a:true,b:true}};
const modeNames={direct:'直连',route:'路由',aggregate:'聚合'};
const names={codex:'Codex',claude:'Claude'};
function selected(){return Object.keys(state.selected).filter(k=>state.selected[k]);}
function fullText(){return '---\nname: review-code\n---\n# 代码审阅\n\n- 优先列出严重问题，最多五条。\n- 用中文输出。'+(state.external?'\n- 保留英文术语。':'');}
function beforeText(k){return original[k]+(k==='claude'&&state.external?'\n- 保留英文术语。':'');}
function canPreview(){return selected().length>0&&(!state.selected.claude||state.choice==='new');}
function notify(msg){$('#toast').textContent=msg;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').textContent='',4300);$('#announce').textContent=msg;}
function resetTask(){state.stage='choose';state.selected={codex:true,claude:true};state.choice='';state.preview=0;state.confirmed=false;state.external=false;state.staleTriggered=false;state.results={};}
function render(){const focus=document.activeElement?.id;document.querySelectorAll('[data-action="view"]').forEach(b=>b.setAttribute('aria-current',b.dataset.value===state.view?'page':'false'));$('#app').innerHTML=state.view==='desktop'?desktop():hostView();if(focus&&document.getElementById(focus))document.getElementById(focus).focus({preventScroll:true});}
function intro(title,sub,note){return `<div class="intro"><div><h1>${title}</h1><p>${sub}</p></div><div class="route-note">${note}</div></div>`;}
function footer(){return `<div class="footer-notes"><div><b>在哪用</b><p>日常在 Codex 对话里发起；桌面端保留软件发现、模型与账号、分配与恢复。</p></div><div><b>改哪里</b><p>先认清目标与复制／链接关系，再查看完整拟写入内容。浏览方案不会切换配置。</p></div><div><b>失败如何回来</b><p>备份没齐就不写；写入后逐目标报告。恢复也单独确认，并明确宿主重载未验证。</p></div></div>`;}
function sidebar(){return `<aside class="sidebar"><div class="label">本地工具</div><button data-action="entry" data-value="软件发现"><span class="nav-icon">⌘</span>软件发现</button><button data-action="tab" data-value="models" class="${state.tab==='models'?'active':''}"><span class="nav-icon">◈</span>模型与账号</button><button data-action="tab" data-value="skills" class="${state.tab==='skills'?'active':''}"><span class="nav-icon">◇</span>Skills</button><button data-action="entry" data-value="MCP"><span class="nav-icon">⌁</span>MCP</button><button data-action="entry" data-value="提示词与记忆"><span class="nav-icon">≡</span>提示词与记忆</button><div class="bottom">保留本地管理入口<br>草图未连接真实软件<br><span class="mono">DESIGN / 2026.10</span></div></aside>`;}
function desktop(){return intro('把配置和恢复留在身边','保留桌面端的本地价值，把日常发起交还给你正在使用的工具。','建议方向：先补足安全更新，再接薄工具入口。此页面不代表当前产品已实现。')+`<div class="shell">${sidebar()}<section class="workspace"><div class="workspace-head"><strong>${state.tab==='skills'?'分配与恢复':'模型入口'}</strong><div class="inner-tabs"><button data-action="tab" data-value="skills" class="${state.tab==='skills'?'active':''}">Skill 分配</button><button data-action="tab" data-value="models" class="${state.tab==='models'?'active':''}">模型与模式</button></div></div><div class="workspace-body">${state.tab==='skills'?workflow():modelsView()}</div></section></div>`+footer();}
function scenarioSelect(){return `<label class="scenario" for="scenario"><span>演示情景</span><select id="scenario"><option value="normal" ${state.scenario==='normal'?'selected':''}>正常更新</option><option value="stale" ${state.scenario==='stale'?'selected':''}>预览过期</option><option value="backup" ${state.scenario==='backup'?'selected':''}>备份失败</option><option value="partial" ${state.scenario==='partial'?'selected':''}>Claude 写入失败</option></select></label>`;}
function workflow(){let index=state.stage==='choose'?1:['preview','stale'].includes(state.stage)?2:3;return `<div class="task-title"><div><div class="label">一个更新任务</div><h2 class="mono">review-code <span class="tag blue">v1 → v2</span></h2><p>统一确认版 · 保留中文偏好 · 两个独立副本</p></div>${scenarioSelect()}</div><div class="stepper"><div class="step ${index===1?'active':''}"><i>1</i>选择与处理</div><div class="step ${index===2?'active':''}"><i>2</i>完整预览</div><div class="step ${index===3?'active':''}"><i>3</i>结果与恢复</div></div>${state.stage==='choose'?chooseView():['preview','stale'].includes(state.stage)?previewView():resultView()}`;}
function sourceRow(){return `<div class="source-row"><span class="arrow" aria-hidden="true">↗</span><div class="source-copy"><strong>发布源的新规则</strong><p>“列出全部问题” → “优先列出严重问题，最多五条”</p></div><button class="link small" data-action="diff" data-value="source">看源差异</button></div>`;}
function chooseView(){return sourceRow()+`<div class="section-line"><h3>这次更新到哪里</h3><button class="link small" data-action="semantics">复制与链接有什么不同？</button></div><div class="targets">${target('codex')}${target('claude')}</div>${state.external?'<div class="notice">已重新检查：Claude 新增「保留英文术语」。完整预览会保留这条偏好；请重新决定冲突规则，再确认。</div>':''}<div class="actionbar"><p>${!state.selected.claude?'Claude 保持原样，不属于本次写入。':state.choice?'两个目标使用同一确认版；Claude 原排序规则将替换，中文偏好会加入。':'先决定 Claude 的规则；若希望长期保留不同版本，可本轮跳过它。'}</p><button class="primary" data-action="preview" ${canPreview()?'':'disabled'}>生成完整预览 <span aria-hidden="true">→</span></button></div>`;}
function target(k){return `<article class="target"><div class="target-top"><label for="target-${k}"><input id="target-${k}" type="checkbox" data-target="${k}" ${state.selected[k]?'checked':''}>${names[k]}</label><span class="tag">复制 · 独立文件</span></div><div class="target-body"><p>${k==='codex'?'<span class="tag good">可保留</span> 本地添加「用中文输出」':'<span class="tag warn">需决定</span> 本地改为「按文件排序，不限条数」'}</p><div class="path">${esc(paths[k])}</div><button class="link small" data-action="diff" data-value="${k}">查看当前内容与差异</button>${k==='claude'&&state.selected.claude?`<div class="decision"><div class="decision-title">新版限制条数，与本地规则冲突</div><label class="choice" for="decision-new"><input id="decision-new" type="radio" name="decision" value="new" ${state.choice==='new'?'checked':''}><span>采用新版规则，加入中文偏好</span></label><label class="choice" for="decision-skip"><input id="decision-skip" type="radio" name="decision" value="skip"><span>本轮跳过 Claude，保持原文件</span></label></div>`:''}</div></article>`;}
function contentBlock(){return `<div class="full-content"><div class="code-head"><span>完整拟写入 · SKILL.md</span><span>统一确认版 / P${state.preview}</span></div><pre>${esc(fullText())}</pre></div>`;}
function previewView(){let stale=state.stage==='stale';return `<div class="section-line"><h3>预览 P${state.preview} · ${selected().map(k=>names[k]).join(' + ')}</h3><span class="tag ${stale?'warn':'blue'}">${stale?'已过期 · 不能应用':'尚未写入'}</span></div><p class="small muted">${selected().map(k=>`${names[k]}：${esc(paths[k])}`).join('<br>')}</p>${stale?'<div class="notice warning"><b>模拟：Claude 文件在预览后变化。</b><br>外部新增「保留英文术语」。本轮未写入，旧确认已失效。重新检查后需要再次处理冲突并确认。</div>':'<div class="notice">保留：中文输出'+(state.external?'、英文术语':'')+'。'+(state.selected.claude?' 替换：Claude 的排序／不限条数规则。':'')+' 所有选中目标的原文件备份成功后，才开始逐目标写入。</div>'}${contentBlock()}<label class="confirm" for="confirm-preview"><input type="checkbox" id="confirm-preview" ${state.confirmed?'checked':''} ${stale?'disabled':''}><span>我已核对完整内容和以上目标，确认将这份内容写入选中的副本（模拟）。</span></label><div class="actionbar"><p>目标为复制模式。写入结果按目标单独报告，不承诺多目标一起成功。</p><div class="actions"><button data-action="back">返回调整</button>${stale?'<button data-action="refresh" class="primary">重新检查并预览</button><button disabled>应用预览已禁用</button>':`<button class="primary" id="apply-button" data-action="apply" ${state.confirmed?'':'disabled'}>确认后应用 · 模拟</button>`}</div></div>`;}
function resultView(){let failed=Object.values(state.results).some(v=>v==='failed');let blocked=Object.values(state.results).includes('blocked');let title=blocked?'未写入：备份未准备齐':failed?'部分完成：请分别处理每个目标':'本次处理结果';return `<div class="section-line"><h3>${title}</h3><span class="tag">模拟结果 · P${state.preview}</span></div>${blocked?'<div class="notice error">Claude 原文件备份失败。此次更新在写入前停止，所有选中目标保持原样。</div>':failed?'<div class="notice warning">Claude 写入前失败，仍为原文件。请查看各自结果；如果其他目标已更新，可以先恢复，再重新准备任务。</div>':'<div class="notice">下面是每个目标的模拟回读结果。两个软件是否重新加载了新内容，尚未验证。</div>'}<div class="results">${selected().map(k=>resultRow(k)).join('')}</div><div class="neutral">宿主重新加载：未验证。文件回读一致，不能证明软件已使用新规则。真实实现还需逐文件记录、失败恢复与实际软件验证。</div><div class="actionbar"><p>备份按目标保存原文件。恢复只影响你选定的目标，需要再次确认。</p><div class="actions"><button data-action="backups">查看本次备份</button><button data-action="restart" class="primary">重新准备任务</button></div></div>`;}
function resultRow(k){let status=state.results[k],title={applied:'已写入 · 模拟回读一致',failed:'失败 · 原文件未变',blocked:'未写入 · 备份未齐',restored:'已恢复 · 模拟回读一致'}[status];return `<div class="result-row"><div><strong><span class="result-icon ${status==='failed'||status==='blocked'?'bad':''}">${status==='applied'||status==='restored'?'✓':'—'}</span>${names[k]}</strong><p>${title}</p><div class="path">${esc(paths[k])}</div></div>${status==='applied'?`<button data-action="restore" data-value="${k}">恢复原文件</button>`:`<button class="link small" data-action="current" data-value="${k}">查看现在的内容</button>`}</div>`;}
function conversation(panel){return `<div class="chat-header"><strong>${panel?'同一段讨论':'Codex · 维护 Skill'}</strong><span class="tag">入口示意</span></div><div class="conversation"><div class="message user"><div class="speaker">你</div><div class="bubble">比较 review-code 新版和我的 Codex、Claude。先让我看清改动，再决定更新。</div></div><div class="message"><div class="speaker">助手</div><p>新版改成了“优先严重问题，最多五条”。</p><ul><li>Codex 添加的中文偏好可以保留。</li><li>Claude 的“不限条数”与新版冲突，需要你决定。</li></ul><div class="tool-chip">FyAgent · 检查 → 预览 → 应用<br>拟议本地工具，未连接</div><p>${panel?'右侧把两个目标放在一起。':'右侧借用宿主已有差异审阅的表达方式。'}确认前不会改动文件。</p></div><div class="message"><div class="speaker">当前任务</div><p>${state.stage==='choose'?'请选择目标，并处理冲突。':state.stage==='stale'?'预览已过期。旧确认不能继续使用。':state.stage==='preview'?'完整拟写入已展开，等待你核对确认。':'结果已按目标列出；软件重新加载未验证。'}</p></div></div><div class="chat-compose">此处仅示意对话入口；用右侧按钮体验流程。</div>`;}
function hostView(){const panel=state.view==='panel';return intro(panel?'同一个任务，多一块面板': '在当前对话里，把更新做完',panel?'比较项：只有对象和状态持续难辨认时，再投入独立面板。':'薄入口承接发起与解释，差异审阅承接完整内容，FyAgent 承担本地分配与恢复。',panel?'候选方案，不列为首轮必做。与薄入口使用同一规则、同一模拟状态。':'以下为独立页面中的宿主示意，未嵌入 Codex，未连接真实工具。')+`<div class="shell ${panel?'panel-shell':'chat-shell'}"><aside class="chat-pane">${conversation(panel)}</aside><section class="review-pane"><div class="section-line"><span class="label">${panel?'候选 · 双目标面板':'宿主已有审阅 · 表达示意'}</span><span class="tag">${panel?'仅作比较':'先验证薄入口'}</span></div>${workflow()}</section></div>`+footer();}
function modelsView(){return `<div class="task-title"><div><div class="label">模型仍在宿主里选择</div><h2>连接方式，先看再启用</h2><p>上游 v4.0.0 预发布候选的交互推演；不代表 FyAgent 已支持。</p></div><span class="tag warn">预发布候选 · 模拟</span></div><div class="model-current"><span class="tag blue">当前模拟状态：${modeNames[state.currentMode]}</span><span class="muted">点击下方模式，只浏览方案。</span></div><div class="model-modes">${Object.keys(modeNames).map((m,i)=>`<button class="mode-button ${state.mode===m?'active':''}" data-action="mode" data-value="${m}" aria-pressed="${state.mode===m}"><span class="mode-no">0${i+1}</span><b>${modeNames[m]}</b><p>${{direct:'使用指定供应商，保持简洁的单一入口。',route:'让请求经过本地路由；单独配置故障转移。',aggregate:'把多家供应商的模型放到宿主原生列表中。'}[m]}</p></button>`).join('')}</div><div class="model-area"><div><div class="section-line"><h3>${state.mode==='aggregate'?'在宿主中呈现的候选模型':'拟使用的模型入口'}</h3><span class="tag">${state.mode==='aggregate'?'名称 · 来源':'虚构示例'}</span></div><div class="model-item"><label for="model-a"><input id="model-a" type="checkbox" data-model="a" ${state.models.a?'checked':''}>模型 Alpha <span class="muted">· 团队 A</span></label><span class="tag">候选</span></div>${state.mode==='aggregate'?`<div class="model-item"><label for="model-b"><input id="model-b" type="checkbox" data-model="b" ${state.models.b?'checked':''}>模型 Beta <span class="muted">· 团队 B</span></label><span class="tag">候选</span></div>`:''}<div class="notice ${state.mode==='aggregate'?'warning':''}">${state.mode==='aggregate'?'聚合不提供故障转移。选中的供应商不可用时，不能把它描述成会自动换一家继续。':state.mode==='route'?'故障转移属于路由策略，需要单独设置并验证。本草图没有配置或演示自动切换。':'该模式只使用一个供应商。浏览其他方案不会改变目前配置。'}</div></div><div class="model-side"><h3>启用前核对</h3><p>目标软件：Codex（模拟）</p><label for="provider">默认供应商</label><select id="provider"><option ${state.provider==='团队 A'?'selected':''}>团队 A</option><option ${state.provider==='团队 B'?'selected':''} ${state.mode==='aggregate'?'':'disabled'}>团队 B</option></select><p>模型按“名称 · 来源”区分，避免同名选错来源。</p><p>候选路径：</p><div class="path">R:\\演示\\Codex\\config.toml</div></div></div><div class="actionbar"><p>启用后需客户端重新加载模型列表；重载效果未验证。真实配置、账号与凭证不会在这里读取。</p><button class="primary" data-action="model-preview" ${(!state.models.a&&state.mode!=='aggregate')||(!state.models.a&&!state.models.b)?'disabled':''}>查看拟启用方案 →</button></div>`;}
let modalContext={};
function openModal(title,body,actions){$('#modal').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="ghost" data-action="close" aria-label="关闭对话框">×</button></div><div class="dialog-body">${body}</div><div class="dialog-actions">${actions||'<button data-action="close">关闭</button>'}</div>`;$('#modal').showModal();}
function showDiff(k){let name=k==='source'?'发布源':names[k];let old=k==='source'?'# 代码审阅\n- 列出全部问题。':beforeText(k);let next=k==='source'?'# 代码审阅\n- 优先列出严重问题，最多五条。':fullText();openModal(`${name} · 当前与拟更新内容`,`<p class="muted small">固定演示内容。实际实现需核对整个 Skill 目录及旧版基线；本例仅有 SKILL.md。</p><div class="full-content"><div class="code-head">当前内容 · ${esc(paths[k])}</div><pre class="diff-old">${esc(old)}</pre></div><div class="full-content"><div class="code-head">${k==='source'?'发布源 v2':'采用新版并保留偏好时的完整结果'}</div><pre class="diff-new">${esc(next)}</pre></div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;
if(a==='view'){state.view=v;render();return;}if(a==='tab'){state.tab=v;render();return;}if(a==='close'){$('#modal').close();return;}
if(a==='entry'){openModal(`${v} · 保留入口`,`<p>${{软件发现:'继续让用户找到本机 AI 软件及其配置位置。本轮草图只标明入口，不模拟真实扫描。',MCP:'继续管理各目标软件的 MCP 配置。这个管理页面不等于已经存在一个可供 Codex 调用的 FyAgent 工具服务器。',提示词与记忆:'保留当前本地用途。本轮不扩建跨宿主统一聊天、记忆或任务总管。'}[v]}</p><p class="muted small">仅说明下一轮产品边界；未读取本机安装、账户或配置。</p>`);return;}
if(a==='semantics'){openModal('先分清：复制还是链接',`<p><b>本例：复制。</b>Codex 与 Claude 各有独立文件，可能各自被修改，需要分别备份、更新和报告。</p><div class="full-content"><pre>${esc(paths.source)}\n  ├─ 复制 → ${esc(paths.codex)}\n  └─ 复制 → ${esc(paths.claude)}</pre></div><p style="margin-top:16px"><b>如果是链接：</b>两个入口可能指向同一份主库内容。改动会联动，不能把它们当成独立副本来选择或承诺互不影响。</p><div class="notice warning">真实实现应先解析链接关系，再展示影响范围；无法识别时停止写入。本草图不演示链接写入。</div>`);return;}
if(a==='diff'){showDiff(v);return;}
if(a==='preview'&&canPreview()){state.preview++;state.confirmed=false;if(state.scenario==='stale'&&!state.staleTriggered&&state.selected.claude){state.stage='stale';state.staleTriggered=true;}else state.stage='preview';render();notify(state.stage==='stale'?'模拟外部改动：预览已过期，应用被禁用。':'完整拟写入已生成，尚未写入。');return;}
if(a==='refresh'){state.external=true;state.choice='';state.confirmed=false;state.stage='choose';render();notify('已重新检查。请重新决定冲突并生成新的预览。');return;}
if(a==='back'){if(state.stage==='stale'){state.external=true;state.choice='';}state.stage='choose';state.confirmed=false;render();return;}
if(a==='apply'&&state.stage==='preview'&&state.confirmed){const backupFails=state.scenario==='backup'&&state.selected.claude;state.results={};selected().forEach(k=>state.results[k]=backupFails?'blocked':state.scenario==='partial'&&k==='claude'?'failed':'applied');state.stage='result';render();notify('模拟处理结束。请查看逐目标结果。');return;}
if(a==='backups'){const blocked=Object.values(state.results).includes('blocked');openModal('本次备份 · 模拟',`<p>每个目标保存各自的原文件。本例不是主库统一备份，也不承诺多文件或多目标绝对原子成功。</p><div class="results">${selected().map(k=>`<div class="result-row"><div><strong>${names[k]}</strong><p>${blocked&&k==='claude'?'失败：模拟备份位置不可写':'已保存原文件 · 模拟'}</p><div class="path">R:\\演示\\备份\\P${state.preview}\\${names[k]}\\SKILL.md</div></div></div>`).join('')}</div><p class="muted small" style="margin-top:14px">所有内容只存在于页面内存。关闭或刷新页面后模拟状态重置。</p>`);return;}
if(a==='current'){openModal(`${names[v]} · 现在的内容（模拟）`,`<div class="full-content"><pre>${esc(state.results[v]==='applied'?fullText():beforeText(v))}</pre></div>`);return;}
if(a==='restore'){modalContext={target:v};openModal(`恢复 ${names[v]} 原文件`,`<p>只恢复 ${names[v]} 的本次更新前内容，其他目标保持各自状态。</p><div class="path">${esc(paths[v])}</div><div class="full-content"><div class="code-head">将恢复为 · P${state.preview} 原文件备份</div><pre>${esc(beforeText(v))}</pre></div><label class="confirm" for="confirm-restore"><input type="checkbox" id="confirm-restore"><span>已核对目标与原文，确认恢复此目标（模拟）。</span></label>`,`<button data-action="close">取消</button><button class="primary" id="restore-button" data-action="restore-confirm" disabled>确认恢复</button>`);return;}
if(a==='restore-confirm'&&$('#confirm-restore').checked){state.results[modalContext.target]='restored';$('#modal').close();render();notify(`${names[modalContext.target]} 已模拟恢复，宿主重新加载仍未验证。`);return;}
if(a==='restart'){resetTask();render();notify('已开始一轮新的模拟任务；演示情景保持不变。');return;}
if(a==='mode'){state.mode=v;if(v!=='aggregate')state.provider='团队 A';render();notify(`正在浏览${modeNames[v]}方案。当前模拟状态仍是${modeNames[state.currentMode]}。`);return;}
if(a==='model-preview'){const models=state.mode==='aggregate'?[state.models.a?'模型 Alpha · 团队 A':null,state.models.b?'模型 Beta · 团队 B':null].filter(Boolean):['模型 Alpha · 团队 A'];if(state.mode==='aggregate'&&((state.provider==='团队 A'&&!state.models.a)||(state.provider==='团队 B'&&!state.models.b))){notify('默认供应商需要有选中的候选模型；请调整选择。');return;}openModal('拟启用方案 · 尚未切换',`<p>Codex：<b>${modeNames[state.currentMode]} → ${modeNames[state.mode]}</b></p><p>默认供应商：${state.provider}</p><div class="full-content"><div class="code-head">完整方案摘要 · 固定演示</div><pre>目标：R:\\演示\\Codex\\config.toml\n模式：${modeNames[state.mode]}\n默认供应商：${state.provider}\n模型列表：\n${models.map(m=>'  - '+m).join('\n')}\n恢复点：本次切换前的配置（模拟）</pre></div><div class="notice ${state.mode==='aggregate'?'warning':''}">${state.mode==='aggregate'?'聚合不提供故障转移。':''} 此处只演示确认边界，不是真实配置差异。客户端列表重载尚未验证。</div><label class="confirm" for="confirm-model"><input type="checkbox" id="confirm-model"><span>已核对目标、模式和默认来源，确认启用此方案（模拟）。</span></label>`,`<button data-action="close">取消</button><button class="primary" id="enable-button" data-action="model-enable" disabled>确认启用 · 模拟</button>`);return;}
if(a==='model-enable'&&$('#confirm-model').checked){state.currentMode=state.mode;$('#modal').close();render();notify('模拟状态已更新。客户端是否重载模型列表，尚未验证。');return;}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scenario'){state.scenario=t.value;resetTask();render();notify('演示情景已切换，任务已重置。');return;}if(t.dataset.target){state.selected[t.dataset.target]=t.checked;if(t.dataset.target==='claude')state.choice='';render();return;}if(t.name==='decision'){if(t.value==='skip'){state.selected.claude=false;state.choice='';}else state.choice='new';render();return;}if(t.id==='confirm-preview'){state.confirmed=t.checked;$('#apply-button').disabled=!t.checked;return;}if(t.id==='confirm-restore'){$('#restore-button').disabled=!t.checked;return;}if(t.id==='confirm-model'){$('#enable-button').disabled=!t.checked;return;}if(t.dataset.model){state.models[t.dataset.model]=t.checked;render();return;}if(t.id==='provider'){state.provider=t.value;return;}});
render();
</script>
</body>
</html>
