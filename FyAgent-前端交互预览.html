    <title>FyAgent</title>

    <style data-fyagent-inline-entry="stylesheet">.fy-memory-page{display:grid;grid-template-rows:116px 67px minmax(0,1fr);width:100%;min-width:0;height:100%;min-height:0;padding:0 31px 44px 26px;color:var(--fy-text)}.fy-memory-header{display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 14px 0 12px}.fy-memory-title-group{display:flex;align-items:flex-start;flex-direction:column;gap:6px;min-width:0;transform:translateY(7px)}.fy-memory-header h1{margin:0;color:var(--fy-text);font-size:clamp(30px,2.35vw,38px);font-weight:650;line-height:1.08;letter-spacing:-.02em}.fy-memory-title-group p{margin:0;color:var(--fy-text-tertiary);font-size:clamp(12px,.95vw,15px)}.fy-memory-prototype-status{color:#68d8f8;font-size:11px;font-weight:550;letter-spacing:.01em}.fy-memory-primary-action{min-width:206px;min-height:52px;padding:0 26px;border:1px solid rgba(112,190,255,.38);border-radius:999px;color:var(--fy-text);font-size:clamp(15px,1.3vw,20px);font-weight:600;background:linear-gradient(180deg,#1873e1fa,#0a52bdf5);box-shadow:inset 0 1px #f5f8fc29,0 10px 26px #03275e52;cursor:pointer;transform:translateY(12px);transition:border-color .18s cubic-bezier(.2,.8,.2,1),filter .18s cubic-bezier(.2,.8,.2,1),transform .12s cubic-bezier(.2,.8,.2,1)}.fy-memory-primary-action:hover{border-color:var(--fy-selected-border);filter:brightness(1.08)}.fy-memory-primary-action:active{transform:translateY(13px)}.fy-memory-tabs-row{align-self:start;height:51px;border-bottom:1px solid rgba(206,224,240,.2)}.fy-memory-tabs{display:flex;align-items:stretch;height:51px;gap:26px;padding-left:12px}.fy-memory-tab{position:relative;min-width:118px;padding:0 8px 10px;border:0;color:var(--fy-text-secondary);font-size:clamp(15px,1.32vw,20px);font-weight:500;background:transparent;cursor:pointer}.fy-memory-tab:after{position:absolute;right:8px;bottom:-1px;left:8px;height:3px;border-radius:2px 2px 0 0;background:transparent;content:""}.fy-memory-tab:hover,.fy-memory-tab[aria-selected=true]{color:var(--fy-text)}.fy-memory-tab[aria-selected=true]:after{background:#25c8f5;box-shadow:0 0 12px #25c8f547}.fy-memory-grid{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(0,1.78fr) minmax(0,1fr);gap:17px;min-width:0;min-height:0}.fy-memory-pane{min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(206,224,240,.22);border-radius:16px;background:linear-gradient(180deg,#2a4e6961,#16344d47),#1837508a;box-shadow:inset 0 1px #f5f8fc0f,0 10px 32px #04101e1f;backdrop-filter:blur(18px) saturate(1.04);-webkit-backdrop-filter:blur(18px) saturate(1.04)}.fy-memory-pane h2{margin:0;color:var(--fy-text);font-size:clamp(18px,1.45vw,23px);font-weight:600;line-height:1.25;letter-spacing:-.01em}.fy-memory-library{display:flex;flex-direction:column;padding:30px 18px 22px}.fy-memory-library h2{margin:0 8px 21px}.fy-memory-search{display:flex;flex:0 0 auto;align-items:center;height:48px;gap:10px;padding:0 14px;border:1px solid rgba(206,224,240,.2);border-radius:999px;color:var(--fy-text-secondary);background:#1e3d5685;box-shadow:inset 0 1px #f5f8fc09}.fy-memory-search:focus-within{border-color:var(--fy-focus);box-shadow:0 0 0 2px #70beff21}.fy-memory-search input{width:100%;min-width:0;height:100%;padding:0;border:0;outline:0;color:var(--fy-text);font:inherit;font-size:clamp(14px,1.12vw,18px);background:transparent}.fy-memory-search input::-moz-placeholder{color:var(--fy-text-tertiary);opacity:.78}.fy-memory-search input::placeholder{color:var(--fy-text-tertiary);opacity:.78}.fy-memory-list{flex:1 1 auto;min-height:0;margin:18px 0 0;padding:0;overflow-y:auto;border:1px solid rgba(206,224,240,.13);border-radius:9px;list-style:none;background:#15334c3d;scrollbar-color:rgba(169,189,207,.35) transparent;scrollbar-width:thin}.fy-memory-list li+li{border-top:1px solid rgba(206,224,240,.12)}.fy-memory-list-row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;gap:12px;padding:9px 16px;border:1px solid transparent;color:var(--fy- - 默认使用简体中文；技术名词、命令和代码标识在更准确时保留英文。
- 先给结论和下一步，再补充必要依据。
- 需要提问时一次问清会改变方案的关键问题，避免多轮追问。`,enabled:!0,kind:"builtin",category:"角色与表达",origin:"本机规则提炼",targetIds:Kr(fa),updatedAt:"本机扫描 · 08-12"},{id:"goal-boundary-evidence",name:"目标、边界与完成证据",description:"先确认要做什么，再用真实结果收口",content:`# 任务闭环

- 开始前确认目标、范围、依赖和验收条件。
- 优先读取项目已有规则与真实代码，不凭空补全关键事实。
- 声称完成前运行与风险相称的验证，并说明本轮真实结果。`,enabled:!0,kind:"builtin",category:"验收规则",origin:"本机规则提炼",targetIds:Kr(fa),updatedAt:"本机扫描 · 08-12"},{id:"context-first",name:"先读项目上下文",description:"按全局与项目层级加载规则",content:`# 上下文加载

- 会话开始时先读取当前目录与上级目录生效的指导文件。
- 项目规则优先于通用习惯；发现冲突时说明采用了哪一层。
- 只加载当前任务需要的规则、记忆和工具说明。`,enabled:!1,kind:"builtin",category:"通用规则",origin:"本机规则提炼",targetIds:Kr(fa),updatedAt:"本机扫描 · 08-12"},{id:"planning-design",name:"规划与方案对比",description:"先搭框架，比较方案后再执行",content:`# 规划与设计

- 先明确用户问题、使用场景和成功标准。
- 对非显然选择至少比较可行方案、代价与风险。
- 计划必须写出外部依赖、关键分岔和可验证的下一步。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:["claude-global","codex-global"],updatedAt:"本机扫描 · 08-12"},{id:"implementation-discipline",name:"最小改动与真实验证",description:"遵循现有架构，只改完成任务所需内容",content:`# 代码实现

- 修改前搜索已有实现、类型、测试和约定，优先复用。
- 做最小且完整的改动，保护与任务无关的现有内容。
- 先运行最接近改动的检查，再覆盖受影响范围。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:Kr(Fp),updatedAt:"本机扫描 · 08-12"},{id:"code-review",name:"代码审查",description:"优先发现正确性、回归与数据风险",content:`# 代码审查

- 优先检查正确性、数据丢失、竞态、兼容性和回归风险。
- 只报告能够从代码或运行结果证明的问题。
- 每个问题说明影响、触发条件、准确位置和修复方向。`,enabled:!1,kind:"builtin",category:"验收规则",origin:"官方基础模板",targetIds:Kr(Fp),updatedAt:"内置 v1"},{id:"memory-continuity",name:"记忆读取与写回",description:"先读稳定记忆，重要变化及时记录",content:`# 记忆连续性

- 行动前读取与当前任务相关的用户偏好、决策和历史教训。
- 重要决定、重复失败模式或用户明确要求记住的内容，写入对应的长期记忆。
- 每日记录、会话原文和长期结论分开保存，不用原始聊天替代结论。`,enabled:!1,kind:"builtin",category:"记忆规则",origin:"本机规则提炼",targetIds:Kr(hv),updatedAt:"本机扫描 · 08-12"},{id:"tool-troubleshooting",name:"工具失败先定位根因",description:"保留错误证据，逐层确认真实阻塞",content:`# 工具与故障

- 先保留准确错误、输入与环境，再判断是配置、权限、网络还是运行时问题。
- 不用重复重试代替诊断；每次尝试都应验证一个明确假设。
- 修复后重跑原失败路径，并记录可复用的预防方法。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:Kr(fa),updatedAt:"本机扫描 · 08-12"},{id:"heartbeat-boundary",name:"定时任务与心跳边界",description:"只在有变化或到期时主动运行",content:`# 定时与心跳
